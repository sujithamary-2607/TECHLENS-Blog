# Render Blueprint: one Node/Express API and one React/Vite static site.
# Render will ask you to provide the sync:false values during setup.
services:
  - type: web
    name: techlens-api
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22.17.0
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_URL
        sync: false
      - key: ADMIN_NAME
        value: Blog Administrator
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false

  - type: static
    name: techlens-frontend
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_URL
        sync: false
      - key: VITE_GA_MEASUREMENT_ID
        sync: false
      - key: VITE_GOOGLE_SITE_VERIFICATION
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
